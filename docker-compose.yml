# Lokale Hilfsdienste. Postgres läuft ohne Docker über `npm run dev:db` (embedded-postgres).
services:
  # S3-kompatibler Speicher für Bilder (lokal; im Cluster z. B. MinIO wie bei paarli-de)
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: community-site-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
